# configs/rl_config.yaml
# Reinforcement learning configuration

environment:
  state_dim: 117           # UASA state dimension (fixed)
  action_dim: 3            # 0=Maintain, 1=Shift Left, 2=Shift Right
  max_steps: 500           # Max steps per episode
  seed: 42

  # Temporal action smoothing (implementation choice — tunable)
  action_smoothing:
    enabled: true
    ema_alpha: 0.7         # EMA smoothing factor (higher = more responsive)
    min_persistence: 3     # Minimum steps before action change allowed

# ---- PPO ----
ppo:
  policy: "MlpPolicy"
  learning_rate: 3.0e-4
  n_steps: 2048
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  total_timesteps: 500000
  checkpoint_dir: "checkpoints/rl/ppo"

# ---- A2C ----
a2c:
  policy: "MlpPolicy"
  learning_rate: 7.0e-4
  n_steps: 5
  gamma: 0.99
  gae_lambda: 1.0
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  rms_prop_eps: 1.0e-5
  total_timesteps: 500000
  checkpoint_dir: "checkpoints/rl/a2c"

# ---- TRPO ----
# Implementation choice: custom TRPO (conjugate gradient + line search)
trpo:
  learning_rate: 1.0e-3
  max_kl: 0.01             # KL divergence constraint
  damping: 0.1             # Fisher-vector product damping
  cg_iters: 10             # Conjugate gradient iterations
  backtrack_iters: 10      # Line search backtrack steps
  backtrack_coeff: 0.8
  gamma: 0.99
  gae_lambda: 0.95
  batch_size: 4096
  total_timesteps: 500000
  checkpoint_dir: "checkpoints/rl/trpo"

# ---- Recurrent PPO (LSTM) ----
recurrent_ppo:
  policy: "MlpLstmPolicy"
  learning_rate: 3.0e-4
  n_steps: 128
  batch_size: 64
  n_epochs: 10
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  lstm_hidden_size: 256
  n_lstm_layers: 1
  total_timesteps: 500000
  checkpoint_dir: "checkpoints/rl/recurrent_ppo"

# ---- Soft-Voting Ensemble ----
ensemble:
  # Initial equal weights (implementation choice — can be made learnable)
  weights:
    ppo: 0.25
    a2c: 0.25
    trpo: 0.25
    recurrent_ppo: 0.25
  # Set to true to use performance-based adaptive weights
  adaptive_weights: false

# ---- Reward Function ----
# All coefficients are implementation choices — experimentally tunable
# NOT taken verbatim from the research paper
reward:
  progress_reward: 1.0          # R_progress base reward per step
  severity_penalty: 2.0         # P_severity coefficient
  uncertainty_penalty: 0.5      # P_uncertainty coefficient
  steering_penalty: 0.3         # P_steering (abrupt action change)
  collision_penalty: 10.0       # P_collision (hard collision)

  # Thresholds
  high_severity_threshold: 0.6  # Severity score above which full penalty applies
  high_uncertainty_threshold: 0.7

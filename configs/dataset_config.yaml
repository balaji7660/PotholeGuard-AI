# configs/dataset_config.yaml
# Dataset configuration

datasets:
  # Supported datasets
  pothole600:
    name: "Pothole-600"
    # DO NOT hard-code paths — set via environment variable or CLI override
    root: "${POTHOLE600_ROOT}"
    image_dir: "images"
    mask_dir: "masks"
    has_depth: false             # RGB-only → use pseudo-depth

  pothole_rgbd:
    name: "PotholeRGBD"
    root: "${POTHOLE_RGBD_ROOT}"
    image_dir: "rgb"
    mask_dir: "masks"
    depth_dir: "depth"
    has_depth: true

  # Active dataset for training (pothole600 | pothole_rgbd | combined)
  active: "pothole600"

splits:
  train: 0.70
  val: 0.15
  test: 0.15
  seed: 42
  stratified: false

preprocessing:
  image_size: [512, 512]
  normalize:
    mean: [0.485, 0.456, 0.406]  # ImageNet statistics
    std:  [0.229, 0.224, 0.225]
  depth_scale: 1.0               # depth = raw_value * depth_scale (dataset-specific)

augmentation:
  enabled: true                  # Training only
  horizontal_flip: true
  vertical_flip: false
  random_rotate:
    enabled: true
    limit: 15                    # degrees
  color_jitter:
    enabled: true
    brightness: 0.2
    contrast: 0.2
    saturation: 0.2
    hue: 0.05
  gaussian_blur:
    enabled: true
    blur_limit: 7
  random_crop:
    enabled: false               # Keep full image for segmentation accuracy
  cutmix:
    enabled: true
    prob: 0.5
    alpha: 1.0                   # Beta distribution alpha

pseudo_depth:
  # MiDaS v3 model to use for RGB-only datasets
  # Loaded via torch.hub or timm
  model: "DPT_Large"            # Options: DPT_Large, DPT_Hybrid, MiDaS_small
  device: "auto"
  output_scale: 1.0             # Scale factor applied to MiDaS output
  invert: true                  # MiDaS outputs inverse depth — invert to metric-like
